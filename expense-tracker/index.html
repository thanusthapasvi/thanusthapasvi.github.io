<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Expense Tracker</title>
	<style>
		:root {
			--color: #209fdf;
			--color2: #9f20df;
			--black: hsl(0deg, 0%, 0%);
			--text: #000000;
		}
		*, *::after, *::before {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		input, button {
			border: none;
			outline: none;
		}
		body, html {
			width: 100%;
			height: 100%;
			user-select: none;
		}
		header {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: clamp(50px, 4rem, 80px);
			background-color: var(--color);
			color: var(--text);
			padding: 0.5rem;
			justify-content: space-between;
			z-index: 20;
			border-bottom: 1px solid var(--color2);
			box-shadow: 0 1px 4px var(--color2);
		}
		body {
			background-color: var(--black);
			position: relative;
		}
		h1 {
			font-size: 2.5rem;
		}
		#menu {
			border-radius: 50%;
		}
		.menu-pop {
			display: none;
			position: absolute;
			top: 50%;
			left: 50%;
			width: clamp(280px, 25%, 400px);
			height: clamp(340px, 20%, 400px);
			transform: translate(-50%, -50%);
			background-color: transparent;
			z-index: 10;
		}
		.menu-content {
			width: 100%;
			height: 100%;
			position: relative;
			padding: 1rem;
			padding-top: 3rem;
			gap: 0.5rem;
			background-color: hsl(from var(--black) h s calc(l + 15));
			border-radius: 12px;
		}
		.menu-row {
			width: 100%;
			display: flex;
			align-items: center;
			justify-content: space-between;
		}
		.menu-label {
			font-size: 1.2rem;
			color: white;
		}
		input[type="color"] {
			width: 2rem;
			height: 2rem;
		}
		#first-day {
			width: 4rem;
			height: 2rem;
			font-size: 1.2rem;
		}
		.reset-budget, .default, .set-total-budget {
			font-size: 1.2rem;
			width: 150px;
			height: 2rem;
			padding: 4px 6px;
			border: 2px solid transparent;
			color: white;
		}
		.set-total-budget {
			background: linear-gradient(120deg, #1212bb, #3434ff, #1212bb);
		}
		.default, .reset-budget {
			background: linear-gradient(120deg, #aa1212, #ff4545, #aa1212);
		}
		.default:active, .reset-budget:active, .set-total-budget:active {
			transform: scale(0.9);
		}
		.save {
			position: absolute;
			bottom: 1rem;
			left: 50%;
			width: 5rem;
			height: 2rem;
			font-size: 1.4rem;
			transform: translateX(-50%);
			
		}
		.save:active {
			transform: scale(0.9) translateX(-50%);
		}

		.budget-track {
			width: clamp(280px, 30%, 500px);
			height: clamp(280px, 30%, 500px);
			background-color: hsl(from var(--black) h s calc(l + 20));
			display: block;
		}
		.top-row, .bottom-row {
			width: 100%;
			padding: 0.5rem;
		}
		.top-row {
			position: absolute;
			height: 4.5rem;
			top: 0;
			left: 0;
			background-color: hsl(from var(--black) h s calc(l + 30));
			color: var(--text);
			border-radius: 12px 12px 0 0;
			text-align: center;
		}
		.bottom-row {
			margin-top: 5rem;
			height: calc(100% - 4.5rem);
			color: white;
			gap: 1rem;
		}
		.start-total {
			gap: 1rem;
			& p {
				color: white;
			}
			& span {
				color: white;
			}
		}
		.current-amount {
			color: white;
			font-size: 2rem;
			font-weight: bold;
		}
		.start-amount {
			color: white;
			font-weight: bold;
		}
		.add-amount-label {
			font-size: 2rem;
		}
		.add {
			width: 5rem;
			height: 2rem;
			font-size: 1.4rem;
		}
		.add:active {
			transform: scale(0.9);
		}

		.set-total-amount {
			display: none;
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			width: clamp(250px, 25%, 350px);
			height: 200px;
			background-color: transparent;
		}
		.set-total-amount-main {
			width: 100%;
			height: 100%;
			background-color: black;
			gap: 1rem;
			color: white;
			& .set-total-heading {
				font-size: 1.4rem;
			}
			& button {
				width: 6rem;
				height: 2rem;
				font-size: 1rem;
			}
		}
		.budget-amount-buttons {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 1rem;

			& button {
				position: relative;
			}
		}
		.close-pop {
			position: absolute;
			top: 4px;
			right: 0.5rem;
			font-size: 1.3rem;
			color: white;
			background-color: transparent;
			cursor: pointer;
		}
		.close-pop:hover {
			color: red;
		}
		.toast {
			position: fixed;
			bottom: 2rem;
			left: 50%;
			width: clamp(280px, 50%, 480px);
			height: clamp(2rem, auto, 4rem);
			transform: translateX(-50%);
			padding: 0.3rem 0.5rem;
			border-radius: 0.4rem;
			background: linear-gradient(to bottom right, #343434, #111111);
			box-shadow: 0 0 6px 2px #9a9a9a;
			animation: comeUp 0.5s ease-out;

			& p {
				text-align: center;
				font-size: 1.2rem;
			}
		}
		.errorBlock {
			display: none;
			& .errorP {
				color: red;
			}
		}
		.messageBlock {
			display: none;
			& .messageP {
				color: cyan;
			}
		}
		@keyframes comeUp {
			from {
				transform: translateX(-50%) translateY(6rem);
			}
			to {
				transform: translateX(-50%) translateY(0rem);
			}
		}

		.set-budget-tutorial {
			display: none;
			position: absolute;
			top: calc(120% + 10px);
			left: 50%;
			transform: translateX(-50%);
			min-width: 240px;
			min-height: 2rem;
			padding: 4px 6px;
			background-color: rgba(0, 0, 0, 0.3);
			color: white;
			font-size: 1rem;
			border-radius: 0.5rem;
			border: 1px solid white;
			pointer-events: none;
			z-index: 5;

			& .tutorial-tip {
				position: absolute;
				top: -10px;
				left: 50%;
				transform: translateX(-50%);
				width: 10px;
				height: 10px;
				background-color: white;
				clip-path: polygon(50% 0%, 0% 100%, 100% 100%);	
			}
		}

		.edit-start {
			/* pencil icon */
			display: none;
		}

		.flex {
			display: flex;
		}
		.align-center {
			align-items: center;
		}
		.justify-center {
			justify-content: center;
		}
		.flex-column {
			flex-direction: column;
		}
		.pointer {
			cursor: pointer;
		}
		.gradient-border {
			position: relative;
			border-radius: 12px;
		}
		.gradient-border::after {
			position: absolute;
			content: "";
			width: calc(100% + 4px);
			height: calc(100% + 4px);
			top: 0;
			left: 0;
			transform: translate(-2px, -2px);
			background: linear-gradient(120deg, var(--color) 25%, var(--color2) 45%, var(--color2) 55%, var(--color) 75%);
			border-radius: 12px;
			z-index: -1;
		}
		.button-effect {
			background-color: transparent;
			border: 3px solid var(--color);
			border-radius: 4px;
			color: white;
		}
		.menu-button-effect {
			border-radius: 4px;
			outline: 3px solid var(--color);
			outline-offset: -6px;
			transition: all 0.2s ease;
		}
		.money-input {
			width: 200px;
			height: 2rem;
			border-radius: 4px;
			padding: 0.5rem;
			background-color: var(--color);
			color: var(--text);
			border: 3px solid transparent;
			font-size: 1.2rem;

		}
		.money-input:focus {
			outline: 3px solid var(--color2);
		}
		.gradient-text {
			background: linear-gradient(to right, var(--color), var(--color2));
			color: transparent;
			background-clip: text;
			-webkit-text-stroke: 0.5px black;
		}
		@media(max-width: 600px) {
			h1 {
				font-size: 2rem;
			}
			.add-amount-label {
				font-size: 1.5rem;
			}
		}
		@media(max-width: 400px) {
			h1 {
				font-size: 1.8rem;
			}
			.add-amount-label {
				font-size: 1.2rem;
			}
		}
		@media(hover: hover) and (pointer: fine) {
			.button-effect:hover {
				background-color: var(--color);
				border: 2px solid var(--color);
				box-shadow: 0 0 6px var(--color);
				color: var(--text);
			}
			.menu-button-effect:hover {
				outline: 3px solid var(--color2);
				outline-offset: 3px;
			}
			input:focus-visible, button:focus-visible {
				box-shadow: 2px 2px var(--color), -2px -2px var(--color2), 0 0 4px 2px black;
				animation: focusAni 1s linear infinite;
			}
			@keyframes focusAni {
				0%, 100% {
					box-shadow: 2px 2px var(--color), -2px -2px var(--color2), 0 0 4px 2px black;
				}
				25% {
					box-shadow: -2px 2px var(--color), 2px -2px var(--color2), 0 0 4px 2px black;
				}
				50% {
					box-shadow: -2px -2px var(--color), 2px 2px var(--color2), 0 0 4px 2px black;
				}
				75% {
					box-shadow: 2px -2px var(--color), -2px 2px var(--color2), 0 0 4px 2px black;
				}
			}
			.money-input:hover {
				box-shadow: 0 0 6px 2px var(--color);
			}
		}
	</style>
</head>
<body class="flex align-center justify-center">
	<header class="flex align-center">
		<h1 class="gradient-text">Expense Tracker</h1>
		<svg width="32" height="32" viewport="0 0 32 32" alt="menu icon" id="menu" class="pointer" onclick="openMenu()">
			<rect x="13" y="3" width="6" height="6" rx="1.5" fill="var(--color2)"/>
			<rect x="13" y="13" width="6" height="6" rx="1.5" fill="var(--color2)"/>
			<rect x="13" y="23" width="6" height="6" rx="1.5" fill="var(--color2)"/>
		</svg>
	</header>

	<div class="budget-track gradient-border">
		<div class="top-row">
			<p class="current-amount">0</p>
			<div class="start-total flex align-center justify-center">
				<p>Start Amount: <span class="start-amount">0</span></p>
				<svg class="edit-start pointer" width="24" height="24" viewport="0 0 24 24" onclick="setTotalAmount()">
					<rect x="16" y="5" width="4" height="4" rx="0.5" transform="rotate(-45, 16, 4)" fill="var(--color2)"/>
					<rect x="4" y="14" width="14" height="4" transform="rotate(-45, 6.5, 12)" fill="var(--color2)"/>
					<path d="M6.5 15.5 L 8.5 17.5 L 5 19Z" fill="black"/>
				</svg>
			</div>
		</div>
		<div class="bottom-row flex align-center justify-center flex-column">
			<label for="add-spent" class="add-amount-label">Add Spent Amount</label>
			<input type="type" inputmode="numeric" pattern="[0-9]*" name="add" id="add-spent" class="money-input" placeholder="0" maxlength="9"/>
			<button type="submit" class="add pointer button-effect" onclick="addSpentAmount()">Add</button>
		</div>
	</div>


	<div class="set-total-amount">
		<div class="set-total-amount-main gradient-border flex align-center justify-center flex-column">
			<p onclick="openSetTotalPop()" class="close-pop">X</p>
			<p class="set-total-heading">Set Month's Budget</p>
			<input type="type" inputmode="numeric" pattern="[0-9]*" name="month-amount" id="set-total" class="money-input" min="1" maxlength="9" required />
			<div class="budget-amount-buttons">
				<button class="set-budget pointer button-effect">
					Set Amount
					<div class="set-budget-tutorial">
						<div class="tutorial-tip"></div>
						<p>To set the new amount & removes previous budget amount</p>
					</div>
					
				</button>
				<button class="add-set-budget pointer button-effect">
					Add Amount
					<div class="set-budget-tutorial">
						<div class="tutorial-tip"></div>
						<p>To add the entered amount to previous budget amount</p>
					</div>
				</button>
			</div>
		</div>
	</div>

	<div class="menu-pop ">
		<div class="menu-content flex align-center flex-column gradient-border">
			<div class="menu-row">
				<label for="color-1" class="menu-label">Primary Color:</label>
				<input type="color" name="color-1" id="color1"/>
			</div>
			<div class="menu-row">
				<label for="color-2" class="menu-label">Secondary Color:</label>
				<input type="color" name="color-2" id="color2"/>
			</div>
			<div class="menu-row">
				<label for="first-day" class="menu-label">First day of Month:</label>
				<input type="number" inputmode="numeric" pattern="[0-9]*" name="first-day" id="first-day" min="1" max="10" value="1" />
			</div>
			<button type="button" class="set-total-budget pointer menu-button-effect" onclick="setTotalAmount()">Change Total</button>
			<button type="button" class="reset-budget pointer menu-button-effect" onclick="resetBudget()">Reset Budget</button>
			<button type="button" class="default pointer menu-button-effect" onclick="restoreDefault()">Restore Default</button>
			<button type="submit" class="save pointer button-effect">Save</button>
		</div>
	</div>
	<div class="errorBlock toast">
		<p class="errorP">Error</p>
	</div>
	<div class="messageBlock toast">
		<p class="messageP">Message</p>
	</div>
	<script>
		// for tutorial at first
		let firstTimeSetBudget = true;

		const menuPop = document.querySelector(".menu-pop"); //menu popup
		const setTotalPop = document.querySelector(".set-total-amount"); //add total popup
		const mainApp = document.querySelector(".budget-track"); //main spent interface

		const menu = document.querySelector("#menu");
		let isMenuOpen = false;
		function openMenu() {
			if(isMenuOpen) {
				menuPop.style.display = "none";
				mainApp.style.display = "block"
				isMenuOpen = false;
			} else {
				menuPop.style.display = "flex";
				mainApp.style.display = "none"
				isMenuOpen = true;
			}
		}

		const color1 = document.querySelector("#color1");
		const color2 = document.querySelector("#color2");
		const firstDay = document.querySelector("#first-day");
		const saveMenu = document.querySelector(".save");

		// to set color value to css variable and to input
		const savedColor1 = localStorage.getItem('color');
		const savedColor2 = localStorage.getItem('color2');
		const savedFirstDay = localStorage.getItem('firstDay');
		if (savedColor1) {
		    document.documentElement.style.setProperty('--color', savedColor1);
		    textColor();
		    color1.value = savedColor1;
		}
		if (savedColor2) {
		    document.documentElement.style.setProperty('--color2', savedColor2);
		    color2.value = savedColor2;
		}
		if(savedFirstDay) {
			firstDay.value = savedFirstDay;
		}

		//save the colors
		saveMenu.addEventListener('click', function(){
			const selectedColor1 = color1.value;
			const selectedColor2 = color2.value;
			const selectedFirstDay = firstDay.value;

			document.documentElement.style.setProperty('--color', selectedColor1);
			document.documentElement.style.setProperty('--color2', selectedColor2);

			localStorage.setItem('color', selectedColor1);
			localStorage.setItem('color2', selectedColor2);
			localStorage.setItem('firstDay', selectedFirstDay);

			textColor();
			openMenu();
		} );

		function restoreDefault() {
			const defaultColor1 = '#209fdf';
			const defaultColor2 = '#9f20df';

			localStorage.setItem('color', defaultColor1);
		    localStorage.setItem('color2', defaultColor2);
		    localStorage.setItem('firstDay', 1);

		    document.documentElement.style.setProperty('--color', defaultColor1);
		    document.documentElement.style.setProperty('--color2', defaultColor2);

		    color1.value = defaultColor1;
		    color2.value = defaultColor2;
		    firstDay.value = 1;
		    textColor();
		}
		function getLightness(color) {
			color = color.replace("#", "");

			if(color.length === 3) {
				color = color.split("").map(c => c + c).join("");
			}
			const r = parseInt(color.substring(0, 2), 16) / 255;
			const g = parseInt(color.substring(2, 4), 16) / 255;
			const b = parseInt(color.substring(4, 6), 16) / 255;

			const min = Math.min(r, g, b);
			const max = Math.max(r, g, b);

			const lightness = (max + min) / 2;
			return lightness * 100;
		}
		function textColor() {
			if(getLightness(localStorage.getItem('color')) <= 50) {
		    	document.documentElement.style.setProperty('--text', "#FFFFFF");
		    } else {
		    	document.documentElement.style.setProperty('--text', "#000000");
			}

			if(getLightness(localStorage.getItem('color2')) <= 50) {
				menu.style.backgroundColor = "#ffffffaa";
			} else {
				menu.style.backgroundColor = "#121212aa";
			}
		}

		/* Budget Tracker*/
		let totalAmount, currentAmount;

		const currentAmountText = document.querySelector(".current-amount");
		const totalAmountText = document.querySelector(".start-amount");

		const editTotal = document.querySelector(".edit-start");
		const addAmoutn = document.querySelector(".add");

		const addInput = document.querySelector("#add-spent");

		const setTotalInput = document.querySelector("#set-total");
		const setTotalBtn = document.querySelector(".set-budget");
		const addSetTotalBtn = document.querySelector(".add-set-budget");

		let isSetTotalOpen = false;
		function openSetTotalPop() {
			if(isSetTotalOpen) {
				setTotalPop.style.display = "none";
				mainApp.style.display = "block"
				isSetTotalOpen = false;
			} else {
				setTotalPop.style.display = "flex";
				setTotalInput.value = 0;
				mainApp.style.display = "none"
				isSetTotalOpen = true;
				if(firstTimeSetBudget) {
					setBudgetTutorial();
					firstTimeSetBudget = false;
				}
			}
		}
		if(localStorage.getItem('totalAmount') && Number(localStorage.getItem('totalAmount')) > 0) {
			totalAmount = localStorage.getItem('totalAmount');
			totalAmountText.innerText = totalAmount;
			setTotalInput.value = totalAmount;
		} else {
			setTotalAmount();
		}
		if(localStorage.getItem('currentAmount')) {
			currentAmount = localStorage.getItem('currentAmount');
			currentAmountText.innerText = currentAmount;
		} else {
			currentAmount = totalAmount;
			currentAmountText.innerText = currentAmount;
		}

		function addSpentAmount() {
			let number = addInput.value;
			if(Number(number) > currentAmount || isNaN(parseFloat(number))) {
				errorMessage("Enter a valid value!");
			} else {
				currentAmount = Number(currentAmount) - Number(number);
				localStorage.setItem('currentAmount', currentAmount);
				currentAmountText.innerText = currentAmount;
				addInput.value = 0;
			}
		}
		function setTotalAmount() {
			if(isMenuOpen) {
				openMenu();
			}
			openSetTotalPop();
		} //total amount set
		setTotalBtn.addEventListener('click', function() {
			let number = setTotalInput.value;
			if(!number || isNaN(parseFloat(number))) {
				errorMessage("Invalid Number! Please enter a valid number");
			} else {
				totalAmount = number;
				currentAmount = totalAmount;
				currentAmountText.innerText = currentAmount;
				totalAmountText.innerText = totalAmount;
				localStorage.setItem('totalAmount', totalAmount);
				localStorage.setItem('currentAmount', currentAmount);
				message("Total Budget Amount set Successfully");
				openSetTotalPop();
			}
		});
		addSetTotalBtn.addEventListener('click', function () {
			let number = setTotalInput.value;
			if(!number || isNaN(parseFloat(number))) {
				errorMessage("Invalid Number! Please enter a valid number");
			} else {
				if(totalAmount)
					totalAmount = Number(totalAmount) + Number(number);
				else {
					totalAmount = Number(number);
				}
				totalAmountText.innerText = totalAmount;
				localStorage.setItem('totalAmount', totalAmount);
				message("Added amount to total Budget Amount Successfully");
				openSetTotalPop();
			}
		});

		function resetBudget() {
			localStorage.setItem('currentAmount', 0);
			localStorage.setItem('totalAmount', 0);
			currentAmount = 0, totalAmount = 0;
			currentAmountText.innerText = currentAmount;
			totalAmountText.innerText = totalAmount;
			openMenu();
			openSetTotalPop();
		}

		function setBudgetTutorial() {
			const setBudgetTutorial = document.querySelectorAll(".set-budget-tutorial");
			setBudgetTutorial[0].style.display = "block";
			setTimeout( () => {
				setBudgetTutorial[0].style.display = "none";
				setBudgetTutorial[1].style.display = "block";
			}, 2000);
			setTimeout( () => {
				setBudgetTutorial[1].style.display = "none";
			}, 4000);
		}

		function errorMessage(message) {
			const errorBlock = document.querySelector(".errorBlock");
			const errorP = document.querySelector(".errorP");
			errorBlock.style.display = "none";
			errorBlock.style.display = "block";
			errorP.innerText = message;
			setTimeout(() => {
				errorBlock.style.display = "none";
			}, 1500);
		}
		function message(message) {
			const messageBlock = document.querySelector(".messageBlock");
			const messageP = document.querySelector(".messageP");
