<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Expense Tracker</title>
	<link rel="stylesheet" href="styles.css" />
</head>

<body>
	<header class="flex align-center">
		<h1 class="gradient-text">Expense Tracker</h1>
		<svg width="32" height="32" viewport="0 0 32 32" alt="menu icon" id="menu" class="pointer" onclick="openMenu()">
			<rect x="13" y="3" width="6" height="6" rx="1.5" fill="var(--color2)" />
			<rect x="13" y="13" width="6" height="6" rx="1.5" fill="var(--color2)" />
			<rect x="13" y="23" width="6" height="6" rx="1.5" fill="var(--color2)" />
		</svg>
	</header>

	<main>
		<section>
			<div class="budget-track gradient-border">
				<div class="top-row">
					<p class="current-amount">0</p>
					<div class="start-total flex-center">
						<p>Start Amount: <span class="start-amount">0</span></p>
					</div>
				</div>
				<div class="bottom-row flex-center flex-column">
					<div class="input-box">
						<label for="add-spent-name" class="input-label">Name : </label>
						<input type="text" name="name of expense" id="add-spent-name" class="input-field add-spent-name"
							placeholder="House Rent" maxlength="12" />
					</div>
					<div class="input-box">
						<label for="add-spent-amount" class="input-label">Amount : </label>
						<input type="text" inputmode="numeric" pattern="[0-9]*" name="amount" id="add-spent-amount"
							class="input-field add-spent-amount" placeholder="0" maxlength="9" />
					</div>
					<button type="submit" class="btn secondary-btn" onclick="addSpentAmount()">Add</button>
				</div>
			</div>
		</section>
		<section>
			<div class="expense-view-controls flex-center">
				<button class="btn secondary-btn" onclick="prevDate()">Prev</button>
				<p class="current-expense-date"></p>
				<button class="btn secondary-btn" onclick="nextDate()">Next</button>
			</div>
			<table>
				<thead>
					<tr>
						<th>S.No</th>
						<th>Name</th>
						<th>Amount</th>
					</tr>
				</thead>
				<tbody class="expense-view">
				</tbody>
			</table>
		</section>
	</main>

	<div class="pop-cover set-total-amount">
		<div class="popup gradient-border">
			<div class="pop-head">
				<p>Set Month's Budget</p>
				<p onclick="openSetTotalPop()" class="pop-close">X</p>
			</div>
			<div class="pop-body">
				<input type="text" inputmode="numeric" pattern="[0-9]*" name="monthly amount" id="set-total"
					class="input-field" placeholder="1000" maxlength="8" oninput="zeroRemove(this)" />
				<button class="set-budget btn primary-btn" onclick="addMonthlyTotal()">Set Amount</button>
			</div>
		</div>
	</div>

	<div class="pop-cover menu-pop">
		<div class="popup gradient-border">
			<div class="pop-head">
				<p>Settings</p>
				<p class="pop-close" onclick="openMenu()">X</p>
			</div>
			<div class="pop-body">
				<div class="menu-row">
					<label for="color-1" class="menu-label">Primary Color:</label>
					<input type="color" name="color-1" id="color-1" />
				</div>
				<div class="menu-row">
					<label for="color-2" class="menu-label">Secondary Color:</label>
					<input type="color" name="color-2" id="color-2" />
				</div>
				<div class="menu-row">
					<label for="first-day" class="menu-label">First day of Month:</label>
					<input type="number" inputmode="numeric" pattern="[0-9]*" name="first-day" id="first-day" min="1"
						max="10" value="1" />
				</div>
				<button type="button" class="btn primary-btn" onclick="setTotalAmount()">Change Total</button>
				<div class="danger-buttons flex-center">
					<button type="button" class="btn danger-btn" onclick="resetBudget()">Reset Budget</button>
					<button type="button" class="btn danger-btn" onclick="restoreDefault()">Restore Default</button>
				</div>
				<button type="submit" class="btn secondary-btn save">Save</button>
			</div>
		</div>
	</div>

	<div class="errorBlock toast">
		<p class="errorP">Error</p>
	</div>
	<div class="messageBlock toast">
		<p class="messageP">Message</p>
	</div>

	<script src="script.js"></script>
</body>

</html>
