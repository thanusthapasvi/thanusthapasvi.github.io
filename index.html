<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>My Sites</title>
	<script async 
		src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7863022341647653" crossorigin="anonymous">
	</script>
	<style>
		.light {
			--bg: rgb(120, 120, 200);
			--header-bg: rgb(150, 150, 255);
			--button-bg: rgb(10, 10, 10);
			--text: black;
			--main-bg: rgb(100, 100, 150);
			--text-bg: rgba(230, 230, 230, 0.5);
			--bg-grad-1: rgba(200, 200, 200, 0.5);
			--bg-grad-2: rgba(200, 200, 200, 0);
		}
		.dark {
			--bg: rgb(50, 50, 120);
			--header-bg: rgb(20, 20, 100);
			--button-bg: rgb(80, 80, 80);
			--text: white;
			--main-bg: rgb(10, 10, 80);
			--text-bg: rgba(10, 10, 10, 0.5);
			--bg-grad-1: rgba(25, 25, 25, 0.6);
			--bg-grad-2: rgba(25, 25, 25, 0);
		}
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		body, html {
			width: 100%;
			height: 100%;
		}
		body {
			position: relative;
			background-color: var(--bg);
			overflow: hidden;
		}
		h1 {
			color: var(--text);
		}
		h2 {
			position: absolute;
			top: 1rem;
			text-align: center;
			color: var(--text);
		}
		header {
			width: 100%;
			padding: 0.5rem;
			height: 3.5rem;
			top: 0;
			left: 0;
			position: fixed;
			display: flex;
			align-items: center;
			justify-content: space-between;
			background-color: var(--header-bg);
			box-shadow: 0 2px var(--text);
			border-bottom: 2px solid var(--text);
		}
		.themeButton {
			padding: 6px;
			border: none;
			background-color: var(--button-bg);
			color: #ffffff;
			transition: transform 0.3s ease;
			display: flex;
			align-items: center;
			justify-content: center;
			cursor: pointer;
			border-radius: 50%;
			box-shadow: 0 0 6px 1px black;
		}
		.themeButton:hover {
			transform: scale(1.1);
		}
		main {
			position: fixed;
			width: 100%;
			height: calc(100% - 3.5rem);
			top: 3.5rem;
			left: 50%;
			transform: translateX(-50%);
			background: radial-gradient(circle at 50% 100%, var(--bg-grad-1) 5%, var(--bg-grad-2)),
			linear-gradient(to right, #00c4cc 0%,#6f00ff 100%);
			display: flex;
			align-items: center;
			flex-direction: column;
		}
		.sites-cover {
			width: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 3rem;
			margin: 6rem 1rem 1rem 1rem;
		}
		.sites {
			width: clamp(150px, 20%, 260px);
			aspect-ratio: 1 / 1;
			background: linear-gradient(to bottom right, #00c4cc 0%,#6f00ff 100%);
			border-radius: 0.5rem;
			border: 2px solid gold;
			position: relative;
			overflow: hidden;
			box-shadow: 0 0 6px black;
			transition: all 0.3s ease;
			cursor: pointer;
		}
		.sites:hover {
			transform: scale(1.05);
			box-shadow: 0 0 12px 1px white;
		}
		.site-name {
			position: absolute;
			width: 100%;
			height: 3rem;
			bottom: 0;
			left: 0;
			background-color: var(--text-bg);
			padding: 0.4rem;
			font-size: 1.6rem;
			display: flex;
			align-items: center;
			justify-content: center;
			color: var(--text);
		}
		.bottom-ad-cover {
			position: absolute;
			bottom: 0;
			left: 50%;
			width: clamp(280px, 100%, 1000px);
			max-height: 180px;
			transform: translateX(-50%);
			background-color: rgba(100, 100, 200, 0.8);
			border-radius: 1rem;
		}
		@media(max-width: 950px) {
			.site-name {
				font-size: 1.3rem;
			}
		}
		@media(max-width: 780px) {
			.site-name {
				font-size: 1.2rem;
			}
		}
	</style>
</head>
<body class="light">
	<header class="">
		<h1>My Sites</h1>
		<button title="ThemeButton" type="button" onclick="themeToggle()" class="themeButton">
			<svg viewBox="0 -960 960 960" width="24" height="24" alt="theme logo" id="theme-icon">
				<path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Zm0-80q88 0 158-48.5T740-375q-20 5-40 8t-40 3q-123 0-209.5-86.5T364-660q0-20 3-40t8-40q-78 32-126.5 102T200-480q0 116 82 198t198 82Zm-10-270Z" fill="currentColor"/>
			</svg>
		</button>
	</header>
	<main>
		<h2>Hero few sites I made</h2>
		<div class="sites-cover">
			<div class="sites">
				<p class="site-name">Dragon Game</p>
			</div>
			<div class="sites">
				<p class="site-name">Expense Tracker</p>
			</div>
		</div>
		<div class="bottom-ad-cover">
			<ins class="adsbygoogle"
			     style="display:block"
			     data-ad-client="ca-pub-7863022341647653"
			     data-ad-slot="7244478817"
			     data-ad-format="auto"
			     data-full-width-responsive="true"></ins>
			<script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
		</div>
	</main>
</div>

	</main>
	<script>
		let body = document.querySelector('body');
		let theme = document.querySelector('.themeButton');
		let themeIcon = document.querySelector('#theme-icon path');
		const moon = "M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Zm0-80q88 0 158-48.5T740-375q-20 5-40 8t-40 3q-123 0-209.5-86.5T364-660q0-20 3-40t8-40q-78 32-126.5 102T200-480q0 116 82 198t198 82Zm-10-270Z";
		const sun = "M480-360q50 0 85-35t35-85q0-50-35-85t-85-35q-50 0-85 35t-35 85q0 50 35 85t85 35Zm0 80q-83 0-141.5-58.5T280-480q0-83 58.5-141.5T480-680q83 0 141.5 58.5T680-480q0 83-58.5 141.5T480-280ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Zm326-268Z";
		const currentD = themeIcon.getAttribute('d');

		function themeToggle() {
		    body.classList.toggle('dark');
		    body.classList.toggle('light');
		    if (body.classList.contains('dark')) {
		        themeIcon.setAttribute('d', sun);
		        theme.style.color = "#ffff00";
		    } else {
		        themeIcon.setAttribute('d', moon);
		        theme.style.color = "#ffffff";
		    }
		}

		const sites = document.querySelectorAll(".sites")
			sites[0].addEventListener('click', () => {
				window.open("https://thanusthapasvi.github.io/dragon-game/", "_blank");
			});
			sites[1].addEventListener('click', () => {
				window.open("https://thanusthapasvi.github.io/Expense-Tracker/", "_blank");
			});
	</script>
</body>
</html>
